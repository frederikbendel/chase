version: "3.8"

services:
  openrouteservice:
    image: giscience/openrouteservice:latest
    container_name: ors
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xms1g -Xmx4g"
      BUILD_GRAPHS: "False"
      ORS_CONFIG_LOCATION: /home/ors/config/ors-config.yml
    volumes:
      - ./docker/data:/home/ors/files
      - ./docker/graphs:/home/ors/graphs
      - ./docker/config:/home/ors/config
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/ors/v2/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
